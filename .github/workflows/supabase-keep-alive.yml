name: Supabase Keep Alive

# Automatically ping Supabase every 3 days so the free-tier database never pauses due to inactivity
on:
  schedule:
    # Runs every 3 days at 00:00 UTC (9:00 AM KST)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoints
        env:
          # Prefer repository secret if configured, fallback to project anon key
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdGZvd2Rrd2pha2FmYWhib3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzE5OTEsImV4cCI6MjEwMzkwNzk5MX0.YIM-0am4ijLZq2n5dEraIN_ZR_wchpwHdhy33fOHvFk' }}
          SUPABASE_URL: "https://bptfowdkwjakafahbopy.supabase.co"
        run: |
          echo "=========================================="
          echo "🚀 Starting Supabase Keep-Alive Health Ping"
          echo "Target Project: $SUPABASE_URL"
          echo "=========================================="

          SUCCESS=false

          # 1. Primary Check: PostgREST app_settings table
          echo "Checking PostgREST table endpoint..."
          HTTP_STATUS_REST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 2 \
            -X GET "$SUPABASE_URL/rest/v1/app_settings?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "REST API Status Code: $HTTP_STATUS_REST"

          if [ "$HTTP_STATUS_REST" -ge 200 ] && [ "$HTTP_STATUS_REST" -lt 400 ]; then
            echo "✅ Primary check passed! Database is active and responsive."
            SUCCESS=true
          else
            echo "⚠️ Primary check returned: $HTTP_STATUS_REST (Possible key rotation or cold start)"
          fi

          # 2. Secondary Fallback Check: GoTrue Auth Health endpoint
          echo "Checking Auth Health endpoint..."
          HTTP_STATUS_AUTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 2 \
            -X GET "$SUPABASE_URL/auth/v1/health?apikey=$SUPABASE_ANON_KEY")
          echo "Auth API Status Code: $HTTP_STATUS_AUTH"

          if [ "$HTTP_STATUS_AUTH" -ge 200 ] && [ "$HTTP_STATUS_AUTH" -lt 400 ]; then
            echo "✅ Auth health check passed! Service container is awake."
            SUCCESS=true
          fi

          echo "=========================================="
          if [ "$SUCCESS" = true ]; then
            echo "🎉 Supabase project is active and refreshed! (Keep-alive successful)"
            exit 0
          else
            echo "❌ Both checks returned unexpected statuses (REST: $HTTP_STATUS_REST, AUTH: $HTTP_STATUS_AUTH)."
            echo "👉 If you recently rotated API keys in Supabase, please update 'SUPABASE_ANON_KEY' in GitHub Repository Secrets."
            exit 1
          fi
